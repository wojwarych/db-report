[project]
name = "db-report"
version = "0.1.0"
description = ""
authors = [{ name = "wojwarych", email = "woj.warych@gmail.com" }]
requires-python = ">=3.12"
readme = "README.md"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.16.1",
    "pylint>=3.3.7",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.12.1",
]
prod = [
    "falcon>=4.0.2,<5",
    "uvicorn>=0.35.0,<0.36",
    "sqlalchemy[asyncio]>=2.0.41,<3",
    "asyncpg>=0.30.0,<0.31",
    "dependency-injector>=4.48.1,<5",
]

[tool.uv]
default-groups = ["prod"]

[tool.pytest.ini_options]
testpaths = [ "tests/" ]
addopts = [ "--cov", "--cov-report=term-missing" ]
required_plugins = [ "pytest-cov" ]
minversion = "8.4.2"
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
omit = [ "__init__" ]
source = [ "src/" ]

[tool.coverage.report]
fail_under = 21.5
omit = [ "__init__" ]
show_missing = true
skip_empty = true

[tool.ruff.lint]
select = [
  "E",
  "F",
  "UP",
  "B",
  "SIM",
  "I",
]

[tool.pylint]
disable = ["c-extension-no-member"]

[tool.hatch.build.targets.sdist]
include = ["src/db_report"]

[tool.hatch.build.targets.wheel]
include = ["src/db_report"]

[tool.hatch.build.targets.wheel.sources]
"src/db_report" = "db_report"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
